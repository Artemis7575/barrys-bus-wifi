<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b3d3a"/>
      <stop offset="100%" stop-color="#1a4a44"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffc93c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a52"/>
      <stop offset="45%" stop-color="#ff5a36"/>
      <stop offset="100%" stop-color="#e0451f"/>
    </linearGradient>
    <linearGradient id="roofShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf6f8"/>
      <stop offset="55%" stop-color="#b9dde3"/>
      <stop offset="100%" stop-color="#8fc2cb"/>
    </linearGradient>
    <linearGradient id="glassShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="36%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hubcap" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="55%" stop-color="#aeaeae"/>
      <stop offset="100%" stop-color="#6f6f6f"/>
    </radialGradient>
    <radialGradient id="tireShade" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#111111"/>
    </radialGradient>
    <linearGradient id="bumper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9d9d9"/>
      <stop offset="100%" stop-color="#9a9a9a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="560" height="260" fill="url(#sky)"/>
  <circle cx="440" cy="70" r="90" fill="url(#sunGlow)"/>
  <circle cx="440" cy="70" r="30" fill="#ffe9ad"/>

  <!-- sun rays -->
  <g stroke="#ffc93c" stroke-opacity="0.2" stroke-width="4">
    <line x1="440" y1="70" x2="440" y2="-10"/>
    <line x1="440" y1="70" x2="510" y2="10"/>
    <line x1="440" y1="70" x2="540" y2="70"/>
    <line x1="440" y1="70" x2="370" y2="10"/>
    <line x1="440" y1="70" x2="340" y2="70"/>
  </g>

  <!-- road -->
  <rect x="0" y="222" width="560" height="5" fill="#ffffff" opacity="0.15"/>
  <rect x="15" y="225" width="28" height="3" rx="1.5" fill="#fdf6e8" opacity="0.35"/>
  <rect x="70" y="225" width="28" height="3" rx="1.5" fill="#fdf6e8" opacity="0.35"/>
  <rect x="125" y="225" width="28" height="3" rx="1.5" fill="#fdf6e8" opacity="0.35"/>

  <!-- bus shadow -->
  <ellipse cx="270" cy="220" rx="215" ry="9" fill="#000000" opacity="0.28"/>

  <!-- BUS -->
  <g filter="url(#softShadow)">
    <!-- lower body / skirt -->
    <path d="M 60 150 Q 60 120 90 118 L 470 118 Q 500 118 500 150 L 500 188 Q 500 200 486 200 L 74 200 Q 60 200 60 188 Z" fill="url(#bodyGrad)"/>

    <!-- roof cap with shine -->
    <path d="M 90 118 Q 60 118 60 148 L 60 128 Q 60 100 92 96 L 468 96 Q 500 100 500 128 L 500 148 Q 500 118 470 118 Z" fill="#d8391a"/>
    <path d="M 96 100 Q 92 100 90 104 L 470 104 Q 468 100 464 100 Z" fill="url(#roofShine)" opacity="0.5"/>

    <!-- window band -->
    <rect x="60" y="118" width="440" height="52" fill="#c73f1e"/>

    <!-- windshield (front, right side) -->
    <g>
      <rect x="452" y="126" width="38" height="42" rx="8" fill="url(#glass)"/>
      <path d="M 454 128 L 486 128 L 458 164 Z" fill="url(#glassShine)"/>
      <rect x="452" y="126" width="38" height="42" rx="8" fill="none" stroke="#fdf6e8" stroke-width="2.5"/>
    </g>

    <!-- side mirror -->
    <rect x="486" y="112" width="6" height="14" rx="2" fill="#2a2a2a"/>
    <rect x="482" y="106" width="14" height="10" rx="3" fill="#2a2a2a"/>

    <!-- side windows -->
    <g>
      <rect x="76" y="126" width="52" height="40" rx="8" fill="url(#glass)"/>
      <rect x="140" y="126" width="52" height="40" rx="8" fill="url(#glass)"/>
      <rect x="204" y="126" width="52" height="40" rx="8" fill="url(#glass)"/>
      <rect x="268" y="126" width="52" height="40" rx="8" fill="url(#glass)"/>
      <rect x="332" y="126" width="52" height="40" rx="8" fill="url(#glass)"/>
      <rect x="396" y="126" width="46" height="40" rx="8" fill="url(#glass)"/>

      <path d="M 78 128 L 122 128 L 84 162 Z" fill="url(#glassShine)"/>
      <path d="M 142 128 L 186 128 L 148 162 Z" fill="url(#glassShine)"/>
      <path d="M 206 128 L 250 128 L 212 162 Z" fill="url(#glassShine)"/>
      <path d="M 270 128 L 314 128 L 276 162 Z" fill="url(#glassShine)"/>
      <path d="M 334 128 L 378 128 L 340 162 Z" fill="url(#glassShine)"/>
      <path d="M 398 128 L 436 128 L 404 162 Z" fill="url(#glassShine)"/>

      <g fill="none" stroke="#fdf6e8" stroke-width="2.5">
        <rect x="76" y="126" width="52" height="40" rx="8"/>
        <rect x="140" y="126" width="52" height="40" rx="8"/>
        <rect x="204" y="126" width="52" height="40" rx="8"/>
        <rect x="268" y="126" width="52" height="40" rx="8"/>
        <rect x="332" y="126" width="52" height="40" rx="8"/>
        <rect x="396" y="126" width="46" height="40" rx="8"/>
      </g>
    </g>

    <!-- destination sign -->
    <rect x="76" y="100" width="90" height="14" rx="4" fill="#16211f"/>
    <text x="121" y="110" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#ffe08a" letter-spacing="0.5">BARRY'S BUS</text>

    <!-- livery stripe + text -->
    <rect x="60" y="172" width="440" height="10" fill="#fdf6e8" opacity="0.9"/>
    <text x="280" y="196" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fdf6e8" letter-spacing="0.5">BARRY'S BUS CO.</text>

    <!-- door -->
    <rect x="440" y="150" width="26" height="50" rx="3" fill="#c73f1e" stroke="#fdf6e8" stroke-width="2"/>
    <line x1="453" y1="150" x2="453" y2="200" stroke="#fdf6e8" stroke-width="1.5" opacity="0.6"/>
    <circle cx="460" cy="176" r="1.8" fill="#fdf6e8"/>

    <!-- front bumper + headlight -->
    <rect x="494" y="176" width="10" height="16" rx="3" fill="url(#bumper)"/>
    <circle cx="497" cy="156" r="5" fill="#fff6d9" stroke="#e0451f" stroke-width="1.5"/>

    <!-- rear bumper -->
    <rect x="56" y="176" width="10" height="16" rx="3" fill="url(#bumper)"/>

    <!-- wheel arches (cut into skirt) -->
    <path d="M 104 200 a 34 34 0 0 1 68 0 Z" fill="#0b3d3a"/>
    <path d="M 372 200 a 34 34 0 0 1 68 0 Z" fill="#0b3d3a"/>

    <!-- wheels -->
    <circle cx="138" cy="200" r="26" fill="url(#tireShade)"/>
    <circle cx="138" cy="200" r="14" fill="url(#hubcap)"/>
    <circle cx="138" cy="200" r="4" fill="#4a4a4a"/>

    <circle cx="406" cy="200" r="26" fill="url(#tireShade)"/>
    <circle cx="406" cy="200" r="14" fill="url(#hubcap)"/>
    <circle cx="406" cy="200" r="4" fill="#4a4a4a"/>
  </g>

  <text x="280" y="222" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#ffc93c" letter-spacing="1.5">FREE WI-FI ON BOARD</text>
</svg>
